name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: '3.12'
          enable-cache: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: |
          uv sync --frozen
          npm ci
      - name: Backend boundaries and style
        run: |
          uv run ruff check server tests scripts
          uv run ruff format --check server tests scripts
          uv run python -m unittest discover -s tests -v
      - name: Frontend formatting and production build
        run: |
          npm run format:check
          npm run build
      - name: Real Docker isolation and lifecycle
        run: |
          docker build -t oriclus-python:local -f sandbox.Dockerfile .
          uv run python scripts/check_live.py --offline
