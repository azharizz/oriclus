[project]
name = "oriclus"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.36,<2",
    "contree-sdk>=0.3.6",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "mangum>=0.19,<1",
    "packaging>=26.3",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.53.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.8",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "RUF", "BLE001"]
